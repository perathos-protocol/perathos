[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "perathos"
version = "1.3.1"
description = "Open-source flight recorder for coding agents: signed, timestamped tool-call receipts, a destructive-command guard and verifiable evidence packs"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["click>=8.0", "cryptography>=42.0"]

[project.optional-dependencies]
# jsonschema is in dev so CI exercises the SchemaValidator engine.
dev = ["pytest>=8.0", "ruff>=0.4,<0.16", "jsonschema>=4.21", "rfc3161-client>=1.0.9,<2"]
# SchemaValidator engine (real JSON Schema validation; SSRF-safe).
schema = ["jsonschema>=4.21"]
# Autonomous-agent harness deps — version-bounded (away from yanked/compromised
# arbitrary versions) and centralized here instead of an unpinned inline
# `pip install httpx anthropic` in credential-bearing CI jobs.
agents = ["httpx>=0.27,<0.29", "anthropic>=0.39,<1.0"]
# Legal Citation Verifier (engine 128). Pure stdlib today — the extra exists as a
# stable install target for when the corpus tooling grows heavier deps.
legal = []
# Optional real NLI entailment verifier (heavy; not pulled by `pip install perathos`).
nli = ["transformers>=4.40", "torch>=2.0"]
# Fine-tuning the entailment model (scripts/train_entailment.py) — adds the
# HuggingFace Trainer stack on top of the inference deps.
train = ["transformers>=4.40", "torch>=2.0", "accelerate>=1.1.0", "datasets>=2.0", "scikit-learn>=1.0"]
# MCP server (perathos_verify_answer / perathos_verify_bundle tools) for any
# MCP client (Claude Code, Claude Desktop, etc.). Not pulled by a bare
# `pip install perathos` since most callers never run the server.
mcp = ["mcp>=1.0,<2"]
# Independent RFC 3161 timestamps on flight-recorder checkpoints
# (`perathos session anchor`, `perathos hooks install --anchor`).
anchor = ["rfc3161-client>=1.0.9,<2"]

[project.scripts]
perathos = "perathos.cli:main"
perathos-hook = "perathos.hook:main"
perathos-mcp = "perathos.mcp_server:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests that load heavy optional deps (e.g. the NLI model); skipped when unavailable",
    "exec_hooks: install hooks in exec form (absolute path + args) instead of the shell-string default used by other tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["perathos*"]

[tool.setuptools.package-data]
"perathos.legal" = ["data/*.json"]
"perathos.data.tsa" = ["*.pem"]
