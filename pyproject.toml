[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "perathos"
version = "0.1.0"
description = "Cryptographic proof layer for AI outputs — VRL Proof Bundles"
requires-python = ">=3.11"
dependencies = ["click>=8.0", "pynacl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Autonomous-agent harness deps — version-bounded (away from yanked/compromised
# arbitrary versions) and centralized here instead of an unpinned inline
# `pip install httpx anthropic` in credential-bearing CI jobs.
agents = ["httpx>=0.27,<0.29", "anthropic>=0.39,<1.0"]
# Optional real NLI entailment verifier (heavy; not pulled by `pip install perathos`).
nli = ["transformers>=4.40", "torch>=2.0"]
# Fine-tuning the entailment model (scripts/train_entailment.py) — adds the
# HuggingFace Trainer stack on top of the inference deps.
train = ["transformers>=4.40", "torch>=2.0", "accelerate>=1.1.0", "datasets>=2.0", "scikit-learn>=1.0"]

[project.scripts]
perathos = "perathos.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests that load heavy optional deps (e.g. the NLI model); skipped when unavailable",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["perathos*"]
