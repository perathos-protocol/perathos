name: Pages

# Publishes site/ (landing page + browser evidence verifier) to GitHub Pages.
# Pages must be enabled for the repo with source "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the verifier against the sample pack
        run: |
          mkdir -p /tmp/pack && cd /tmp/pack && unzip -q "$GITHUB_WORKSPACE/site/samples/sample-evidence-pack.zip"
          node "$GITHUB_WORKSPACE/site/verify/node-verify.mjs" /tmp/pack > /dev/null

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
