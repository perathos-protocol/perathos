name: Autonomous Agents

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to run (product-engineer | qa-tester | ux-reviewer | docs-writer | all)"
        required: false
        default: "all"
      dry_run:
        description: "Dry run — print plan but don't commit"
        required: false
        default: "false"
  # Schedule disabled 2026-11-04: the cycle had produced no commits since July
  # and was spending Actions minutes every 2 hours. Run manually via
  # workflow_dispatch if needed.
  # schedule:
  #   - cron: "0 */2 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialize cycles so an overlapping scheduled + dispatched run can't duplicate
# work or open conflicting PRs. Don't cancel an in-progress cycle mid-commit.
concurrency:
  group: autonomous-agents
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # If AGENT_PAT is set, use it so downstream workflows (CI) trigger
          # on agent PRs. Falls back to GITHUB_TOKEN if AGENT_PAT is empty.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install perathos + runner deps
        run: pip install -e ".[dev,agents]"

      - name: Configure git
        run: |
          git config user.name  "perathos-agent[bot]"
          git config user.email "agents@perathos.io"

      - name: Run agent cycle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_FILTER:       ${{ github.event.inputs.agent || 'all' }}
          DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
          # AGENT_PAT triggers CI on agent PRs; GH_TOKEN is the fallback
          # used for API calls when AGENT_PAT is unset.
          AGENT_PAT:          ${{ secrets.AGENT_PAT }}
          GH_TOKEN:           ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
        run: python org/orchestration/execute_cycle.py
