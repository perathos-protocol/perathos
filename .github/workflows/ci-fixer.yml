name: CI Auto-Fixer

on:
  workflow_run:
    workflows: ["CI", "Autonomous Agents"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

# Serialize fixer runs so overlapping workflow_run triggers can't open
# conflicting fix PRs for the same failure.
concurrency:
  group: ci-auto-fixer
  cancel-in-progress: false

jobs:
  fix-failures:
    # Only run when the triggering workflow actually failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install perathos + runner deps
        run: pip install -e ".[dev,agents]"

      - name: Configure git
        run: |
          git config user.name  "perathos-agent[bot]"
          git config user.email "agents@perathos.io"

      - name: Run CI fixer agent
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          FAILED_RUN_ID:      ${{ github.event.workflow_run.id }}
        run: python org/orchestration/fix_failures.py
