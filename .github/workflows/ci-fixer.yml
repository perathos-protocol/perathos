name: CI Auto-Fixer

on:
  workflow_run:
    workflows: ["CI", "Autonomous Agents"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

# Serialize fixer runs so overlapping workflow_run triggers can't open
# conflicting fix PRs for the same failure.
concurrency:
  group: ci-auto-fixer
  cancel-in-progress: false

jobs:
  fix-failures:
    # Only run when the triggering workflow actually failed, and never for runs
    # from forks: this job holds write access and API keys and feeds the failed
    # run's logs to an LLM, so attacker-controlled fork logs would be a prompt-
    # injection path to a token that can push. (Disabled on GitHub 2026-11-04
    # along with the other autonomous agents; run manually if ever needed.)
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install perathos + runner deps
        run: pip install -e ".[dev,agents]"

      - name: Configure git
        run: |
          git config user.name  "perathos-agent[bot]"
          git config user.email "agents@perathos.io"

      - name: Run CI fixer agent
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          FAILED_RUN_ID:      ${{ github.event.workflow_run.id }}
        run: python org/orchestration/fix_failures.py
